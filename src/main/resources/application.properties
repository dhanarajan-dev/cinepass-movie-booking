spring.application.name=movie-booking

# Server Port
server.port=8080

# MySQL Database Configuration
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.url=${DB_URL}
#spring.datasource.username=${DB_USERNAME:root}
spring.datasource.username=${DB_USERNAME}

#spring.datasource.password=${DB_PASSWORD:Dhanaraj@1727}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Static Resources & Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false
spring.web.resources.static-locations=classpath:/static/

# Mail Configuration - Live Gmail SMTP Delivery
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# spring.mail.username=dhanaraj082001@gmail.com
spring.mail.username=${MAIL_USERNAME}

# Configured 16-character Google App Password:
spring.mail.password=${MAIL_APP_PASSWORD}
 #spring.mail.password=xlraipplpnubjasn

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000


# Google OAuth Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Custom Application Properties
app.mail.enabled=true
app.mail.from=${BREVO_FROM_EMAIL}