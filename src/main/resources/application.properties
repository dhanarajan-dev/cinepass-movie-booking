spring.application.name=movie-booking

# Server Port (Supports dynamic PORT assigned by cloud hosts like Render)
server.port=${PORT:8080}

# MySQL Database Configuration
# Supports local MySQL and cloud-hosted MySQL (e.g. Aiven on Render) via environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration (Optimized for cloud-hosted databases like Aiven)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Static Resources & Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false
spring.web.resources.static-locations=classpath:/static/

# Mail Configuration - Live Delivery (Gmail SMTP and Brevo)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Brevo HTTP API Configuration (Optional alternative for cloud deployments)
brevo.api.key=${BREVO_API_KEY:}
brevo.from.email=${BREVO_FROM_EMAIL:}

# Google OAuth Configuration
# Configured with Google Cloud Console OAuth 2.0 Web Client credentials
google.client.id=${GOOGLE_CLIENT_ID:371218908664-heb11ku7bkis3q7oci7d9v1u527stcto.apps.googleusercontent.com}
google.client.secret=${GOOGLE_CLIENT_SECRET:}

# Custom Application Properties
app.mail.enabled=true
app.mail.from=${spring.mail.username}