spring.application.name=movie-booking

# Server Port
server.port=8080

# MySQL Database Configuration
#spring.datasource.url=jdbc:mysql://mysql-26cb5221-dhanaraj082001-52d1.f.aivencloud.com:27183/defaultdb?sslMode=REQUIRED

spring.datasource.url=${DB_URL}
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Static Resources & Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false
spring.web.resources.static-locations=classpath:/static/

# Mail Configuration - Live Gmail SMTP Delivery
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# spring.mail.username=dhanaraj082001@gmail.com
spring.mail.username=${MAIL_USERNAME}

# Configured 16-character Google App Password:
spring.mail.password=${MAIL_APP_PASSWORD}
# spring.mail.password=xlraipplpnubjasn

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Custom Application Properties
app.mail.enabled=true
app.mail.from=${spring.mail.username}
